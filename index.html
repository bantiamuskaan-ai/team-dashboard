<script>
/* Standalone hosting shim: stores data in this browser (localStorage) instead of Claude's shared storage. */
(function(){const P='tw:',L={};
 const read=p=>{try{const v=localStorage.getItem(P+p);return v?JSON.parse(v):null}catch(e){return null}};
 const keys=c=>{const r=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.indexOf(P+c+'/')===0)r.push(k.slice(P.length+c.length+1))}}catch(e){}return r};
 const snap=c=>({docs:keys(c).map(id=>({id:id,data:()=>read(c+'/'+id)}))});
 const db={doc:p=>({set:async d=>{localStorage.setItem(P+p,JSON.stringify(d));const c=p.split('/')[0];(L[c]||[]).forEach(f=>f(snap(c)))}}),
  collection:c=>({onSnapshot:(f)=>{(L[c]=L[c]||[]).push(f);setTimeout(()=>f(snap(c)),0)}})};
 const assets={upload:blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({id:'a'+Date.now(),url:r.result});r.onerror=()=>rej(new Error('Could not read file'));r.readAsDataURL(blob)}),delete:async()=>{}};
 const downloads={save:async o=>{const a=document.createElement('a');a.href=URL.createObjectURL(o.data);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}};
 window.claude={use:async n=>n==='db'?db:n==='assets'?assets:n==='downloads'?downloads:null};
})();
</script>

<script>

 tasks:p[2]===null?[]:[0,1,2,3].map(j=>({t:TASKS[(i+j*3)%8],h:4+((i*7+j*5)%13),due:["Today","Tomorrow","Fri","Next week"][j],late:(i+j)%5===0}))}));

let page=(m=>m&&people[+m[1]]?+m[1]:null)(location.hash.match(/person\/(\d+)/));document.body.classList.toggle('pv',page!==null);

$('#detail').addEventListener('input',e=>{const t=e.target,r=t.closest('.tk');if(!r||cur===null)return;const f=t.dataset.f;T(cur)[+r.dataset.i][f]=f==='h'?(t.value===''?'':+t.value):t.value});

function TB(id){const g=G(id);if(!g.tbl)g.tbl={cols:['Task','Notes'],rows:people[id].tasks.map(t=>[t.t,t.h+'h · due '+t.due])};return g.tbl}
function tblHtml(id){const b=TB(id);
 return `<div class='sub' style='margin-bottom:6px'>Add rows and columns to list what you are working on. Rename a column by typing in its header.</div><div class='scroll'><table class='tt'><thead><tr>${b.cols.map((c,j)=>`<th><div class='th'><input data-c='${j}' value='${esc(c)}' placeholder='Column name'><button data-dc='${j}' title='Delete column'>✕</button></div></th>`).join('')}<th></th></tr></thead><tbody>${b.rows.map((r,i)=>`<tr data-r='${i}'>${b.cols.map((c,j)=>`<td><input data-j='${j}' value='${esc(r[j]||'')}'></td>`).join('')}<td><button data-dr='${i}' title='Delete row'>✕</button></td></tr>`).join('')}</tbody></table></div><button class='btn' data-ar='1'>+ Add row</button><button class='btn' data-ac='1'>+ Add column</button>`}
$('#detail').addEventListener('input',e=>{const t=e.target;if(cur===null||!t.closest('.tt'))return;const b=TB(cur);
 if(t.dataset.j!==undefined)b.rows[+t.closest('tr').dataset.r][+t.dataset.j]=t.value;else if(t.dataset.c!==undefined)b.cols[+t.dataset.c]=t.value});
$('#detail').addEventListener('change',e=>{if(cur!==null&&e.target.closest('.tt'))persist(cur)});
$('#detail').addEventListener('click',e=>{const x=e.target.closest('[data-ar],[data-ac],[data-dr],[data-dc]');if(!x||cur===null)return;const b=TB(cur),d=x.dataset;
 if(d.ar)b.rows.push(b.cols.map(()=>''));

const APPROVER='Dr. Sukanya Patra';
function LV(id){const g=G(id);if(!g.leave)g.leave={ent:{annual:'',personal:''},rows:[]};return g.leave}
function leavePanel(){const el=$('#leave');if(!el||cur===null)return;const L=LV(cur),emp=mode==='employee';

 const bal=(t,n)=>{const en=num(L.ent[t]),u=sum(t,'approved'),pd=sum(t,'pending');return `<div class='card big'><span class='role'>${n} leave</span><b>${en===null?'–':en-u}</b><span class='role'>${en===null?'Entitlement not set yet':'remaining of '+en+' days'} · ${u} used${pd?' · '+pd+' pending':''}</span>${emp?'':`<div style='margin-top:8px'><label class='role'>Entitlement (days) <input class='n' type='number' min='0' step='0.5' data-ent='${t}' value='${esc(L.ent[t])}' style='width:80px'></label></div>`}</div>`};
 const stc={pending:'under',approved:'bal',rejected:'over'},stn={pending:'Pending',approved:'Approved',rejected:'Rejected'};

function render(noG){const th=$('#tmhint');if(th)th.textContent=isMember()?'· click your own name to open your page':'· click a person to open their page';if(isMember()){const pp=people.find(x=>x.name===me.n);if(page!==null&&(!pp||page!==pp.id))page=null;document.body.classList.add('member');document.body.classList.toggle('pv',page!==null)}else document.body.classList.remove('member');
 const q=$("#q").value.toLowerCase(),r=$("#role").value;
 let L=people.map(view).filter(p=>p.name.toLowerCase().includes(q)&&(!r||p.role===r)&&(!$('#proj').value||inProj(p.id,PROJECTS.indexOf($('#proj').value))));
 L.sort((a,b)=>{const x=a[sort.k],y=b[sort.k];return(x>y?1:x<y?-1:0)*sort.d});
 $("#kpis").innerHTML=[["Avg performance",(v=>v.length?Math.round(avg(v)):"–")(L.map(p=>p.perf).filter(x=>x!=null))],["On-time delivery",(v=>v.length?Math.round(avg(v))+"%":"–")(L.map(p=>p.ontime).filter(x=>x!=null))]]
  .map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join("");
 $("#none").hidden=L.length>0;
 $("#rows").innerHTML=L.map(p=>`<tr data-id="${p.id}" class="${p.id===sel?"sel":""}"><td><div class="name">${p.name}${isMember()&&p.name===me.n?' (you)':''}</div><div class="role">${p.role}</div></td>
 ${isMember()&&p.name!==me.n?`<td colspan="2" class="role">Private</td>`:`<td><b>${p.perf==null?'–':p.perf}</b></td><td>${p.ontime==null?'–':p.ontime+'%'}</td>`}</tr>`).join("");
 lastL=L;if(isMember()){$('#kpis').innerHTML='';$('#annual').innerHTML='';$('#actions').innerHTML='';$('#compounds').innerHTML=''}else if(page===null){annualPanel(L);actionsPanel();compoundsPanel()}const cp=page!==null?view(people[page]):(L.find(p=>p.id===sel)||L[0]);cur=page!==null?page:(cp?cp.id:null);detail(isMember()&&page===null?null:cp);projPanel();if(page!==null){crumbs();if(!noG){goalsPanel();leavePanel()}}
}
function line(d,c,min,max,W,H){const pts=d.map((v,i)=>[10+i*(W-20)/(d.length-1),H-8-(v-min)/(max-min)*(H-16)]);
 return`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${c}"/>`).join("")}
function detail(p){const el=$("#detail");
 if(!p){el.innerHTML='<div class="empty">Select a person</div>';return}
 
 el.innerHTML=`<h2>${p.name} <span class="role">· ${p.role}</span></h2>${chartsHtml(p.id)}
 <h2 style="margin-top:12px">Current tasks</h2>${tblHtml(p.id)}
 `}
$("#rows").onclick=e=>{const t=e.target.closest("tr");if(t)go(+t.dataset.id)};
document.querySelectorAll("th").forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(isMember()&&k!=='name')return;sort=sort.k===k?{k,d:-sort.d}:{k,d:k==="name"?1:-1};render()});
["#q","#role","#proj"].forEach(s=>$(s).oninput=()=>{if(s==='#proj'&&$(s).value)pj=PROJECTS.indexOf($(s).value);render()});restoreSession();
render();

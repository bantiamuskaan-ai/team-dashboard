<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Performance</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6eb;--ac:#2f5fd0;--ok:#1f8f5f;--wa:#c98a0a;--er:#cf3b3b;--ok-bg:#e3f4ec;--wa-bg:#fbf0d9;--er-bg:#fbe4e4;--ac-bg:#e6edfb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1a1e26;--tx:#e8eaee;--mu:#98a0ae;--bd:#2a303b;--ac:#7ea3ff;--ok:#4cc790;--wa:#e6b23f;--er:#f27a7a;--ok-bg:#16332a;--wa-bg:#3a2f12;--er-bg:#3b1c1c;--ac-bg:#1e2a47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1a1e26;--tx:#e8eaee;--mu:#98a0ae;--bd:#2a303b;--ac:#7ea3ff;--ok:#4cc790;--wa:#e6b23f;--er:#f27a7a;--ok-bg:#16332a;--wa-bg:#3a2f12;--er-bg:#3b1c1c;--ac-bg:#1e2a47;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mu);font-size:13px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi .v{font-size:26px;font-weight:650;margin-top:2px}.kpi .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.grid{display:block}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:12px;cursor:pointer;user-select:none}
tbody tr{cursor:pointer}tbody tr:hover,tr.sel{background:var(--ac-bg)}
.name{font-weight:600}.role{color:var(--mu);font-size:12px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:90px;position:relative}
.bar i{display:block;height:100%;border-radius:4px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:550}
.under{background:var(--ac-bg);color:var(--ac)}.bal{background:var(--ok-bg);color:var(--ok)}.over{background:var(--er-bg);color:var(--er)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--bg);border-radius:8px;padding:8px}.stats b{display:block;font-size:18px}.stats span{color:var(--mu);font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:4px 0 8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
ul{list-style:none;padding:0;margin:0}li.t{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}li.t:last-child{border:0}
.empty{color:var(--mu);padding:20px;text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.slot{border:1px solid var(--bd);border-radius:10px;padding:12px;min-width:0}
.slot h3{margin:0 0 6px;font-size:14px}.btn{display:inline-block;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;background:var(--card);margin:8px 6px 0 0;font-size:13px}
table.sm{min-width:0;font-size:12px}.sm th{cursor:default;color:var(--tx);font-weight:600}.sm td,.sm th{padding:4px 8px}
.gt{min-width:1250px}.gt td,.gt th{white-space:normal;vertical-align:top;padding:6px}.gt input,.gt textarea{width:100%;font-size:12px;padding:5px}.gt textarea{font:inherit;font-size:12px;min-width:170px;resize:vertical;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px}.gt .n{width:70px}.gt .pts{white-space:nowrap}
input:disabled,textarea:disabled{opacity:.7;cursor:not-allowed}
.emp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.emp>div{background:var(--bg);border-radius:8px;padding:8px}.emp span{display:block;color:var(--mu);font-size:12px}.gh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.actions{margin:10px 0}
body.pv .lv{display:none}body:not(.pv) .pvw{display:none}
#crumbs{font-size:14px;color:var(--mu)}#crumbs a{color:var(--ac);cursor:pointer}#crumbs a:hover{text-decoration:underline}#crumbs b{color:var(--tx)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}.big b{display:block;font-size:30px;line-height:1.25}
body.tsv .pmain{display:none}body:not(.tsv) .ptsw{display:none}.wrap:has(#ts:empty){display:none}
.tsx{--red:#c8102e;--redd:#7d0a1f}
.tsx .card+.card{margin-top:14px}.tsx h2{text-align:center}
.tsx .nav{display:flex;gap:6px;align-items:center;margin:6px 0}
.tsx .nav button{background:var(--red);color:#fff;border:0;border-radius:8px;width:36px;height:36px;cursor:pointer;flex:none}
.tsx .nav select,.tsx .nav .nm{flex:1;min-width:0;border:2px solid var(--red);border-radius:8px;padding:7px 10px;font-weight:600;background:var(--card);color:var(--tx);box-sizing:border-box}
.tsx .info{text-align:center;font-size:13px;margin:8px 0}.tsx .info b{display:block}
.tsx .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.tsx .tb{background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:600;cursor:pointer}
.tsx .tb.dark{background:var(--redd)}.tsx .tb:disabled{opacity:.4;cursor:not-allowed}
.tsx table{min-width:700px;border-collapse:collapse;width:100%}
.tsx th{background:var(--red);color:#fff;text-align:center;cursor:default;font-weight:600;padding:8px 6px;border-bottom:0;font-size:13px}
.tsx td{padding:6px;border-bottom:1px solid var(--bd);text-align:center;vertical-align:middle}
.tsx th.today{background:var(--redd)}.tsx td.today{background:rgba(120,125,135,.18)}.tsx th.wkend{background:var(--redd)}.tsx td.wkend{background:rgba(110,110,110,.32)}
.tsx td select{width:100%;font-size:13px}
.tsx input.h{width:66px;text-align:center;box-sizing:border-box}
.tsx tfoot td{background:#2b2f38;color:#fff;font-weight:600}.tsx td.over,.tsx tfoot td.over{color:#ff8a8a}
.tsx .del{color:var(--red);background:none;border:0;font-size:18px;cursor:pointer;padding:0 4px}
.tsx .tot{font-variant-numeric:tabular-nums;font-weight:600}
.tsx textarea.rem{width:100%;min-width:300px;min-height:92px;box-sizing:border-box;resize:vertical;font:inherit;font-size:13px;line-height:1.4;padding:8px;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px}
.tsx .msg{text-align:center;min-height:18px;font-size:13px;margin-top:6px}
.chip.na{background:var(--bd);color:var(--mu)}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
body.locked #login{display:flex}body.locked .wrap{display:none}body.locked #logout{display:none}body.member [data-mode]{display:none}.wrap:has(#compounds:empty),.wrap:has(#annual:empty),.wrap:has(#chem:empty){display:none}#kpis:empty{display:none}
#login .box{width:100%;max-width:340px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}#login input{width:100%;margin:6px 0 12px}#login button{width:100%;background:var(--ac);color:#fff;border-color:var(--ac)}#lerr{color:var(--er);font-size:13px;min-height:18px;margin-bottom:8px}
.lt{min-width:700px}.lt td{white-space:nowrap}.lt input[type=date],.lt select{width:auto;font-size:12px;padding:5px}
.tt{min-width:0;width:100%}.tt th,.tt td{padding:3px;border-bottom:0}.tt input{width:100%;min-width:130px;font-size:12px;padding:5px}.tt .th{display:flex;gap:4px}.tt .th input{font-weight:600}
.tk{display:grid;grid-template-columns:1fr 70px 140px 110px 34px;gap:6px;margin-bottom:6px;align-items:center}.tk input,.tk select{width:100%;min-width:0;font-size:12px;padding:5px}
@media(max-width:560px){.tk{grid-template-columns:1fr 60px 1fr 34px}.tk>:first-child{grid-column:1/-1}.tk select{grid-column:span 2}}

/* Standalone hosting shim: stores data in this browser (localStorage) instead of Claude's shared storage. */
(function(){const P='tw:',L={};
 const read=p=>{try{const v=localStorage.getItem(P+p);return v?JSON.parse(v):null}catch(e){return null}};
 const keys=c=>{const r=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.indexOf(P+c+'/')===0)r.push(k.slice(P.length+c.length+1))}}catch(e){}return r};
 const snap=c=>({docs:keys(c).map(id=>({id:id,data:()=>read(c+'/'+id)}))});
 const db={doc:p=>({set:async d=>{localStorage.setItem(P+p,JSON.stringify(d));const c=p.split('/')[0];(L[c]||[]).forEach(f=>f(snap(c)))}}),
  collection:c=>({onSnapshot:(f)=>{(L[c]=L[c]||[]).push(f);setTimeout(()=>f(snap(c)),0)}})};
 const assets={upload:blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({id:'a'+Date.now(),url:r.result});r.onerror=()=>rej(new Error('Could not read file'));r.readAsDataURL(blob)}),delete:async()=>{}};
 const downloads={save:async o=>{const a=document.createElement('a');a.href=URL.createObjectURL(o.data);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}};
 window.claude={use:async n=>n==='db'?db:n==='assets'?assets:n==='downloads'?downloads:null};
})();
</script>
